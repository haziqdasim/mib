<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Multipurpose Information Board</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        @font-face {
            font-family: 'FWC2026-NormalRegular';
            src: url('/fonts/FWC2026-NormalRegular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            /* Applied custom font globally */
            font-family: 'FWC2026-NormalRegular', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* Force font rendering override on inputs/headings if necessary */
        h1, h2, h3, h4, h5, h6, span, div, p {
            font-family: 'FWC2026-NormalRegular', sans-serif;
        }

        /* Layout Framework Layout */
        .tv-container {
            height: 100vh;
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .main-content-row {
            display: table-row;
            height: 88vh;
        }

        /* Left Sidebar Panel using table-cell for clean TV layout */
        .sidebar-cell {
            display: table-cell;
            width: 16%;
            vertical-align: top;
            background-color: #000000;
            padding: 20px 15px;
        }

        /* Decorative corner element mimicking image flare gradient */
        .sidebar-header-wrapper {
            position: relative;
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo-img {
            max-width: 75px;
            height: auto;
            position: relative;
            z-index: 2;
        }
        

        /* Carousel Content Cell */
        .carousel-cell {
            display: table-cell;
            width: 84%;
            background-color: #d2d2d2;
            color: #1a1a1a;
            vertical-align: middle;
            text-align: center;
            position: relative;
        }

        .carousel-placeholder-text {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: #111111;
        }

        /* Bottom Live Score Ticker Layout */
        .ticker-row {
            display: table-row;
            height: 12vh;
            background-color: #000000;
        }

        .ticker-container-cell {
            display: table-cell;
            vertical-align: middle;
            padding: 0 15px;
        }

        .ticker-flex-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        .ticker-label {
            font-weight: 700;
            font-size: 1.15rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            padding-right: 20px;
            color: #ffffff;
        }

        .ticker-items-wrapper {
            flex-grow: 1;
            display: flex;
            gap: 15px;
            overflow: hidden;
        }

        .ticker-card {
            background-color: #ffffff;
            color: #000000;
            border-radius: 12px;
            padding: 10px 18px;
            min-width: 240px;
            flex-shrink: 0;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
        }

        .ticker-team-text {
            font-weight: 500;
            font-size: 0.82rem;
        }

        .ticker-score-box {
            font-weight: 700;
            font-size: 1.05rem;
            padding: 0 12px;
            text-align: center;
        }

        .ticker-details-box {
            border-left: 1px solid #dee2e6;
            padding-left: 12px;
            font-size: 0.68rem;
            color: #6c757d;
            line-height: 1.3;
        }

        .bottom-right-logo-cell {
            display: table-cell;
            width: 70px;
            vertical-align: middle;
            text-align: center;
            padding-right: 15px;
            background-color: #000000;
        }

        .mini-logo-img {
            max-height: 48px;
            width: auto;
        }

        .inter{
            font-family: inter;
        }

        .red{
            background-color: #D40101;
            border-radius: 10px;
        }

        .dark-red{
            background-color: #731311;
            border-radius: 10px;
        }

        .green{
            background-color: #00C953;
            border-radius: 10px;
        }

        .dark-green{
            background-color: #004E3C;
            border-radius: 10px;
        }

        

        .card{
            border: none;
        }

    
        .card-header:first-child{
            border-radius: 9px 9px 0 0;
        }

    </style>
</head>

<body>

    <div class="tv-container">

        <!-- Upper Split Dashboard Frame -->
        <div class="main-content-row">

            <!-- Left Match Schedule Side panel -->
            <div class="sidebar-cell">
                <div class="sidebar-header-wrapper">
                    <img src="/assets/logo-white.png" class="img-fluid" style="width:30%" alt="logo">
                </div>

                <h5 class="text-white mt-5">World Cup Matches</h5>
                
                    <div class="card mb-3" style="border-radius: 10px;">
                        <div class="card-header text-white inter fw-bold dark-red">
                            Group Stage
                        </div>
                        <div class="card-body text-dark">
                            <div class="row">
                                <div class="col-md-7">
                                    <img src="/assets/flag/mexico.png" alt="flag"> <span class="inter">Mexico</span><br>
                                    <img src="/assets/flag/southafrica.png" alt="flag"> <span class="inter">South Africa</span>
                                </div>
                                <div class="col-md-5">
                                    <span class="inter">
                                        Fri, 12 Jun
                                        3:00am
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card mb-3" style="border-radius: 10px;">
                        <div class="card-header text-white inter fw-bold red">
                            Group Stage
                        </div>
                        <div class="card-body text-dark">
                            <div class="row">
                                <div class="col-md-7">
                                    <img src="/assets/flag/mexico.png" alt="flag"> <span class="inter">Mexico</span><br>
                                    <img src="/assets/flag/southafrica.png" alt="flag"> <span class="inter">South Africa</span>
                                </div>
                                <div class="col-md-5">
                                    <span class="inter">
                                        Fri, 12 Jun
                                        3:00am
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card mb-3" style="border-radius: 10px;">
                        <div class="card-header text-white inter fw-bold green">
                            Group Stage
                        </div>
                        <div class="card-body text-dark">
                            <div class="row">
                                <div class="col-md-7">
                                    <img src="/assets/flag/mexico.png" alt="flag"> <span class="inter">Mexico</span><br>
                                    <img src="/assets/flag/southafrica.png" alt="flag"> <span class="inter">South Africa</span>
                                </div>
                                <div class="col-md-5">
                                    <span class="inter">
                                        Fri, 12 Jun
                                        3:00am
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card mb-3" style="border-radius: 10px;">
                        <div class="card-header text-white inter fw-bold dark-green">
                            Group Stage
                        </div>
                        <div class="card-body text-dark">
                            <div class="row">
                                <div class="col-md-7">
                                    <img src="/assets/flag/mexico.png" alt="flag"> <span class="inter">Mexico</span><br>
                                    <img src="/assets/flag/southafrica.png" alt="flag"> <span class="inter">South Africa</span>
                                </div>
                                <div class="col-md-5">
                                    <span class="inter">
                                        Fri, 12 Jun
                                        3:00am
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

            </div>

            <!-- Main Display / Media Showcase Center Section -->
            <div class="carousel-cell">
                <div class="carousel-placeholder-text">Carousel</div>
            </div>

        </div>

        <!-- Lower Live Info Banner Ticker Pane -->
        <div class="ticker-row">
            <div class="ticker-container-cell">
                <div class="ticker-flex-layout">
                    <div class="ticker-label">Live Score</div>
                    
                </div>
            </div>

            <!-- Bottom Right Event Logo Bracket -->
            <div class="bottom-right-logo-cell">
                <div class="d-flex bd-highlight">
                    <div class="p-2 w-100 bd-highlight">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="card">
                                    <span class="text-dark arial">
                                        text
                                    </span>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card">
                                    <span class="text-dark arial">
                                        text
                                    </span>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card">
                                    <span class="text-dark arial">
                                        text
                                    </span>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="card">
                                    <span class="text-dark arial">
                                        text
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex-shrink-1 bd-highlight">
                        <img src="/assets/logofooter-white.png" class="img-fluid" style="width:15%" alt="footer-logo">
                    </div>
                </div>

                

            </div>
        </div>

    </div>

    <!-- Bootstrap 5 Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
